name: Security scan

# Two security gates that previously had no CI coverage (360-review O5):
#   1. pnpm audit — fails on high/critical advisories in production deps.
#   2. gitleaks — scans the tree (and PR history) for committed secrets.
#
# Both are BLOCKING. The workflow also runs daily at 07:17 UTC. A small set of
# high advisories with no compatible fix is explicitly accepted in package.json
# -> pnpm.auditConfig.ignoreGhsas and documented in
# docs/security-audit-exceptions.md, so the audit still fails on any NEW high.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 7 * * *"

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.28.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail on high/critical advisories in production deps only (--prod skips
      # devDependencies, which aren't shipped). Accepted exceptions live in
      # package.json's pnpm.auditConfig.ignoreGhsas.
      - name: Audit production dependencies (high/critical)
        run: pnpm audit --prod --audit-level high

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so the scan covers the PR's new commits, not just the
          # tip tree.
          fetch-depth: 0

      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
