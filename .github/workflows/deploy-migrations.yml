name: Deploy Migrations

# Pushes supabase/migrations/** to the linked Supabase project whenever they
# change on main. Closes the gap that let schema changes (e.g. ice_depth_rinks)
# merge to main without ever reaching the database — until now nothing applied
# migrations to the remote project, so they only landed when someone ran them
# by hand.
#
# ─────────────────────────────────────────────────────────────────────────────
# ONE-TIME PREREQUISITE — read before enabling this workflow
# ─────────────────────────────────────────────────────────────────────────────
# `supabase db push` decides what to run by comparing each local migration's
# version (the numeric filename prefix, e.g. 00000000000056) against the rows
# in the remote `supabase_migrations.schema_migrations` table.
#
# This project's remote history was recorded with TIMESTAMP-style versions
# (e.g. 20260506172311) rather than the repo's 00000000000NN prefixes. Because
# none of the repo's version strings exist in that history, a first
# `db push` would consider ALL migrations unapplied and try to replay the
# entire history — which fails immediately on already-existing objects.
#
# Before turning this on, reconcile the history ONCE so already-applied
# migrations are recorded under the repo's version numbers. From a machine
# with the linked project (`supabase link --project-ref <ref>`):
#
#   supabase migration list --linked        # shows local vs remote, side by side
#   # For every migration whose schema is ALREADY in the database, mark it applied:
#   supabase migration repair --status applied <version> [<version> ...]
#   # For any that are genuinely not yet applied, leave them so push can run them.
#   supabase migration list --linked        # re-check: local and remote should align
#
# After that, `supabase db push` is incremental and safe, and this workflow
# keeps it that way on every merge.
#
# ─────────────────────────────────────────────────────────────────────────────
# REQUIRED REPOSITORY SECRETS / VARIABLES
# ─────────────────────────────────────────────────────────────────────────────
#   secret  SUPABASE_ACCESS_TOKEN  — personal/CI access token (account → Access Tokens)
#   secret  SUPABASE_DB_PASSWORD   — the linked project's database password
#   var     SUPABASE_PROJECT_REF   — the project ref (e.g. bqbdgwlhbhabsibjgwmk)
#
# Define the ref as a repo *variable* (not a secret) so it's visible in logs;
# the token and DB password must be secrets.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy-migrations.yml"
  # Manual trigger so a failed/auto-skipped run can be retried without an
  # empty commit, and so the one-time setup can be validated on demand.
  workflow_dispatch:
    inputs:
      include_all:
        description: >-
          Apply migrations sitting BELOW the remote high-water mark
          (supabase db push --include-all). Only for a deliberate, watched
          backlog run — see "August 2026" in docs/DEPLOY.md. The backlog
          currently contains migration 222, a NON-REVERSIBLE audit_logs
          partitioning cutover. Never enable this for a routine deploy.
        type: boolean
        default: false

# Never let two deploys race the same project — migrations are stateful.
concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Guard against running with an unconfigured ref (e.g. on a fork). The
    # token/password are validated implicitly by the CLI calls below.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify project ref is configured
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'bqbdgwlhbhabsibjgwmk' }}
        run: |
          if [ -z "${SUPABASE_PROJECT_REF}" ]; then
            echo "::error::SUPABASE_PROJECT_REF repo variable is not set. See the header of this workflow for setup." >&2
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1 (head of the mutable v1 branch as of pinning)
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF || 'bqbdgwlhbhabsibjgwmk' }}"

      - name: Show pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked

      # An out-of-order backlog is the one situation where a rerun can quietly
      # become something much larger than a deploy: `db push` refuses it and
      # names --include-all in the error, and pasting that flag in applies
      # EVERY pending migration below the high-water mark in one unattended
      # shot. Fail here first, with the runbook, so that choice is made
      # deliberately via workflow_dispatch rather than by copying a hint out
      # of a red log.
      - name: Guard against an out-of-order backlog
        if: ${{ inputs.include_all != true }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail

          # Strip ANSI colour and normalise the box-drawing column separator so
          # the table parses the same locally and on the runner.
          supabase migration list --linked \
            | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/│/|/g' \
            > migration-list.txt

          # Column 1 = local version, column 2 = remote version (blank when the
          # migration has not been applied). Anything pending whose version
          # sorts below the highest applied version is out of order.
          awk -F'|' '
            {
              l = $1; r = $2
              gsub(/[^0-9]/, "", l); gsub(/[^0-9]/, "", r)
              if (r != "" && r + 0 > maxr) maxr = r + 0
              if (l != "" && r == "") pending[np++] = l
            }
            END {
              for (i = 0; i < np; i++)
                if (pending[i] + 0 < maxr) print pending[i]
            }
          ' migration-list.txt > out-of-order.txt

          if [ -s out-of-order.txt ]; then
            {
              echo "Refusing to deploy: these migrations sit below the last version applied on the remote database."
              echo
              sed 's/^/  /' out-of-order.txt
              echo
              echo "A bare 'supabase db push' will fail on this, and rerunning it with"
              echo "--include-all would apply the whole list unattended."
              echo
              echo "Read the 'August 2026' section of docs/DEPLOY.md first. When you are"
              echo "ready to run the backlog deliberately — PITR confirmed, watching the"
              echo "output — use Actions -> Deploy Migrations -> Run workflow and tick"
              echo "'include_all'."
            } >&2
            echo "::error::Out-of-order migration backlog — see docs/DEPLOY.md before rerunning."
            exit 1
          fi

          echo "No out-of-order migrations; the pending set is contiguous."

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.include_all }}" = "true" ]; then
            echo "::warning::Deliberate backlog run: pushing with --include-all."
            supabase db push --include-all
          else
            supabase db push
          fi
