name: E2E

# Nightly Playwright run of the browser-driven E2E suite (e2e/tests/) against
# a DEPLOYED environment — staging by default. This is the black-box layer on
# top of the vitest unit tests (pure logic) and the SQL RLS harness
# (supabase/tests/rls_isolation.sql): it exercises real auth, role
# permissions, report submission, admin flows, and multi-tenant isolation
# through an actual browser hitting a live deployment. See e2e/README.md and
# e2e/TEST-PLAN.md for the scenario map.
#
# Configuration (see e2e/.env.e2e.example for the full variable list):
#   - Target URL: workflow_dispatch `url` input, else vars.E2E_BASE_URL, else
#     the production deployment.
#   - Credentials: E2E_<ROLE>_PASSWORD repo secrets, exclusively (the standing
#     *-test@rinkreports.com accounts — see
#     docs/module-functionality-check-2026-07.md). The old fallback that read
#     cleartext passwords from an `e2e_temp_credentials` table in the live
#     database was removed (and the table dropped, migration 243): storing
#     working interactive logins — including an admin account — in the
#     database meant any DB/service-role compromise yielded live sessions,
#     not just data.
#   - Seed deep links: vars.E2E_FACILITY_B_REPORT_PATH /
#     vars.E2E_ICE_DEPTH_LAYOUT_SLUG / vars.E2E_DAILY_REPORT_PATH, with
#     defaults matching the standing seed.
#
# Fail-soft on forks only: if no target URL or no credential source at all is
# available, a fork's run logs a notice and exits green instead of failing red —
# forks shouldn't get nightly failures. On the canonical repo
# (KellyJ386/Rink-Reports-5-6) the same condition FAILS instead: a deleted
# secret would otherwise silently turn the whole suite into a green no-op.
# Tests missing an individual credential or seed value skip with a reason
# (see e2e/README.md "Graceful skips"), so a partially seeded environment
# stays green too.
#
# Triggers:
#   - schedule: nightly at 06:00 UTC (staging is quietest; after any US-
#     evening manual testing, before the workday).
#   - workflow_dispatch: manual run, optionally against a different base URL.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Base URL to test (overrides the E2E_BASE_URL repo variable)"
        required: false
        type: string

concurrency:
  # Never let two runs race the same shared staging data (the suite itself
  # already runs single-worker for the same reason — see playwright.config.ts).
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      # Dispatch input wins over the repo variable, mirroring post-deploy-smoke;
      # with neither set, default to the production deployment (the only
      # deployed environment this project has).
      E2E_BASE_URL: ${{ inputs.url != '' && inputs.url || vars.E2E_BASE_URL || 'https://www.rinkreports.com' }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_MANAGER_PASSWORD: ${{ secrets.E2E_MANAGER_PASSWORD }}
      E2E_SUPERVISOR_PASSWORD: ${{ secrets.E2E_SUPERVISOR_PASSWORD }}
      E2E_ICETECH_PASSWORD: ${{ secrets.E2E_ICETECH_PASSWORD }}
      E2E_FRONTDESK_PASSWORD: ${{ secrets.E2E_FRONTDESK_PASSWORD }}
      E2E_CONCESSIONS_PASSWORD: ${{ secrets.E2E_CONCESSIONS_PASSWORD }}
      E2E_JANITORIAL_PASSWORD: ${{ secrets.E2E_JANITORIAL_PASSWORD }}
      E2E_INACTIVE_PASSWORD: ${{ secrets.E2E_INACTIVE_PASSWORD }}
      E2E_FACILITY_B_PASSWORD: ${{ secrets.E2E_FACILITY_B_PASSWORD }}
      # Optional non-secret seed config; repo variables win, with defaults
      # matching the standing production seed (see
      # docs/module-functionality-check-2026-07.md).
      E2E_FACILITY_B_REPORT_PATH: ${{ vars.E2E_FACILITY_B_REPORT_PATH || '/reports/incidents/d1bb84fe-fb34-43bd-8e0a-429026bde696' }}
      E2E_DAILY_REPORT_PATH: ${{ vars.E2E_DAILY_REPORT_PATH }}
      E2E_ICE_DEPTH_LAYOUT_SLUG: ${{ vars.E2E_ICE_DEPTH_LAYOUT_SLUG || 'rink-a' }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      # Gate: credentials come from E2E_* repo secrets ONLY. (A previous
      # fallback fetched cleartext passwords from an e2e_temp_credentials
      # table in the live database; that path was removed and the table
      # dropped — see the header comment.) When unconfigured, forks skip
      # with a notice (they shouldn't get nightly failures) but the
      # canonical repo FAILS — an unconfigured canonical run means a secret
      # was deleted, and exiting green would hide a dead suite behind a
      # passing badge. (The `==` comparison is case-insensitive in Actions
      # expressions.)
      - name: Check E2E credentials are configured
        id: gate
        env:
          IS_CANONICAL: ${{ github.repository == 'KellyJ386/Rink-Reports-5-6' }}
        run: |
          fail_or_skip() {
            if [ "$IS_CANONICAL" = "true" ]; then
              echo "::error::E2E suite cannot run — $1 This is the canonical repo, so failing instead of exiting green."
              exit 1
            fi
            echo "::notice::E2E suite skipped — $1"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          }
          if [ -z "$E2E_BASE_URL" ]; then
            fail_or_skip "no target URL resolved."
          elif [ -n "$E2E_ADMIN_PASSWORD" ]; then
            echo "Targeting $E2E_BASE_URL with E2E_* secrets"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            fail_or_skip "E2E_ADMIN_PASSWORD is not configured. Add the E2E_<ROLE>_PASSWORD repo secrets (Settings > Secrets and variables > Actions). See e2e/README.md (CI section)."
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.gate.outputs.configured == 'true'

      # pnpm before setup-node so setup-node's built-in pnpm store cache can
      # find the binary. Version mirrors the lockfile (lockfileVersion 9.0 →
      # pnpm 9/10); pin the major to avoid a future pnpm bumping the lockfile.
      - name: Install pnpm
        if: steps.gate.outputs.configured == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      # Both Playwright projects (desktop + mobile) run on chromium, so one
      # browser download is enough.
      - name: Install Playwright chromium
        if: steps.gate.outputs.configured == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E suite
        if: steps.gate.outputs.configured == 'true'
        run: pnpm test:e2e

      # "05-incidents-accidents.spec.ts" (incident: submits when required
      # fields are completed) submits a real incident report as the frontdesk
      # test account against the live facility — there is no staging
      # environment to isolate it in, and incident reports are intentionally
      # immutable in-app (no delete action; admins can only archive). Left
      # alone this accumulates one permanent row per run forever and
      # inflates the real facility's incident-report counts. Purge it here,
      # directly against the DB, every run — pass or fail (a failed run may
      # still have gotten past that test) — so nightly runs never leave
      # residue. Best-effort: if no DB credential is configured (e.g. a
      # fork), skip with a notice rather than failing the job.
      - name: Clean up synthetic incident report
        if: always() && steps.gate.outputs.configured == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # Project ref as a repo VARIABLE, not a literal: not a secret, but a
          # hardcoded ref hands any repo reader the exact auth host to target
          # with credential stuffing.
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -uo pipefail
          REF="${SUPABASE_PROJECT_REF:-}"
          CANDIDATES=()
          [ -n "${SUPABASE_DB_URL:-}" ] && CANDIDATES+=("$SUPABASE_DB_URL")
          if [ -n "${SUPABASE_DB_PASSWORD:-}" ] && [ -n "$REF" ]; then
            ENCPW=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'],safe=''))")
            CANDIDATES+=("postgresql://postgres.${REF}:${ENCPW}@aws-0-us-east-1.pooler.supabase.com:5432/postgres")
            CANDIDATES+=("postgresql://postgres.${REF}:${ENCPW}@aws-1-us-east-1.pooler.supabase.com:5432/postgres")
            CANDIDATES+=("postgresql://postgres:${ENCPW}@db.${REF}.supabase.co:5432/postgres")
          fi
          if [ "${#CANDIDATES[@]}" -eq 0 ]; then
            echo "::notice::No SUPABASE_DB_URL/SUPABASE_DB_PASSWORD configured — skipping synthetic incident cleanup."
            exit 0
          fi
          DELETE_SQL="delete from public.incident_reports where reporter_name = 'E2E FrontDesk' and description = 'Spectator slipped near the entrance; no injury reported.'"
          for URL in "${CANDIDATES[@]}"; do
            HOSTDESC=$(echo "$URL" | sed -E 's|.*@([^/:]+).*|\1|')
            if OUT=$(psql "$URL" -At -w -c "$DELETE_SQL" 2>/tmp/psql-cleanup.err); then
              echo "Cleaned up synthetic incident report(s) via $HOSTDESC (deleted: ${OUT:-0})"
              exit 0
            fi
            sed 's/:[^@:]*@/:***@/' /tmp/psql-cleanup.err || true
          done
          echo "::warning::Could not connect to the database to clean up the synthetic incident report — it will be purged on the next successful run."

      # e2e/report/ holds the HTML report, results.json, REPORT.md, and the
      # failure screenshots/traces/videos (see playwright.config.ts reporters).
      - name: Upload Playwright report
        if: failure() && steps.gate.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: e2e/report/
          retention-days: 14
          if-no-files-found: ignore
